name: Aceite e cobertura
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Métricas do README estão atualizadas
        run: git diff --exit-code -- README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-e-aceite
          path: coverage/
